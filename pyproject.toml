[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nfr"
version = "0.0.2"
description = "Neutral Format Registry: how image formats and their edge cases must be interpreted, with evidence."
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/nfr"]
